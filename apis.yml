name: PeopleFund, Perfect Technologies
description: >-
  PFC Technologies (formerly PeopleFund) is a Seoul, South Korea fintech company operating at the
  intersection of direct online lending and AI lending infrastructure. It runs two platforms: CPLE
  (Crople), an online investment-linked finance (온라인투자연계금융) service that matches retail investors
  with consumer and small-business loans, and AIRPACK, an AI-powered, no-code underwriting and loan
  operations infrastructure (AIRPACK-Lab for data analysis, model development and approval-rule tuning,
  and AIRPACK-Studio for model deployment, rule-set operation and performance monitoring) sold to
  savings banks and other lending institutions. As of this profile the company publishes no public
  developer portal, OpenAPI, SDK, or partner API surface; AIRPACK integrations are handled through a
  direct sales/contact process. This record was surfaced as a 500 Global portfolio company and enriched
  as an API Evangelist network company profile.
